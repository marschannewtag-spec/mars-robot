# 健檢設定。閾值刻意訂寬 —— 這套系統一年只該叫你幾次,
# 狼來了比漏報更致命:一旦你開始無視通知,整層就等於不存在。

# 資料新鮮度上限(天)。超過就代表來源真的停更了,不是週末或假期。
freshness_days:
  sp_daily: 7      # Yahoo 日K,正常 0-1 天
  vix: 7           # GitHub finance-vix,正常 1-3 天
  shiller: 50      # 月頻,正常落後約一個月

# 數值合理性
sanity:
  vix_min: 5.0
  vix_max: 90.0          # 史上最高月收約 59(2008-10),日內最高 89.5(2020-03)
  max_monthly_gap_pct: 25.0   # 月對月跳空超過這個幅度就要人看一眼
  min_rows:
    sp_daily: 10000
    vix: 8000
    shiller: 1800

# PWA 部署健康
pwa:
  url: "https://marschannewtag-spec.github.io/mars-robot/"
  # 這些字串必須出現在線上的 index.html 裡。少了就代表部署回退或壞掉了。
  expect_markers:
    - "buildVixMonthly"
    - "vixRiskSeries"
    - "fetchT"
    - "readCache"
    - "ddspan"

# PWA 實際在用的免金鑰代理鏈。
# 這是整套健檢最有價值的一項 —— allorigins 就是這樣無聲死掉、
# 導致趨勢腿默默退回月頻長達不知多久,而畫面上完全看不出來。
proxy_probe_target: "https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?interval=1d&range=1mo"
proxies:
  - name: "corsproxy.io"
    template: "https://corsproxy.io/?url={url}"
  - name: "allorigins"
    template: "https://api.allorigins.win/raw?url={url}"

# 已知且已接受的劣化 —— 列在這裡就不會每天報警。
# 新增項目時務必在 commit 訊息寫清楚為什麼可以接受,否則這裡會變成垃圾桶。
accepted:
  # Shiller 的 Dividend 與 Long Interest Rate 欄自 2023-07 起未發布(全為 0)。
  # 影響:總報酬回測窗口只能到 2023-06。已反映在黃金基準的窗口設定上。
  shiller_zero_columns_since: "2023-07"

  # 已知失效、但仍留在退回鏈裡的代理。列在這裡就不會每天報警,
  # 但若「剩下還活著的」也掛掉,PWA 代理鏈那一項仍然會失敗。
  # allorigins:2026-08 實測回 HTTP 408 / 讀取逾時,連抓 example.com 都失敗。
  #            留著是因為它若哪天復活就是免費的備援,且有逾時保護(單次 7 秒)。
  known_dead_proxies:
    - "allorigins"

# 選填:自架 Cloudflare Worker 端點。留空則跳過該項檢查。
worker_url: ""
