# 健檢設定。閾值刻意訂寬 —— 這套系統一年只該叫你幾次,
# 狼來了比漏報更致命:一旦你開始無視通知,整層就等於不存在。

# 資料新鮮度。判準依【來源自己的發布頻率】而定,不是一律用天數。
#
# ⚠ 2026-10-19 改掉 shiller。原本是 `shiller: 50`(天),而 Shiller 是月頻、
#   觀測月 M 的那一列在 M+1 月的 1-2 號才發布 —— 所以那一列在被下一列取代之前,
#   年齡必然會走到約 60 天。50 天的門檻於是【每個月必然破線一次再自動復原】。
#   實測軌跡(ops-data 的 health_log.csv,82 天):
#       08-21 FAIL → 09-01 ok → 09-22 FAIL → 10-02 ok
#   一個每月固定紅一次的檢查項,正是訓練使用者無視通知的最佳設計。
#
#   這【不是】放寬閾值,是判準的單位錯了:應該問「該發布的那一期有沒有到」,
#   不是「最後一期過了幾天」。新規則對真正停更的偵測並沒有變弱 —— 見下。
#
#   publish_grace_day:到當月第幾天之後,才要求「上一個月」那一列必須存在。
#   依據是上面兩次實測的抵達日(1-2 號),加上週末/假日與排程時間的餘裕。
#   不是挑一個比較好過的數字 —— 由 test_monthly_contract_has_no_false_alarms
#   逐日模擬一整年證明它不會假警報,以及 test_a_stopped_monthly_source_is_caught
#   證明它仍然抓得到真的停更。
freshness:
  sp_daily:
    cadence: daily
    max_age_days: 7      # Yahoo 日K,正常 0-1 天
  vix:
    cadence: daily
    max_age_days: 7      # CBOE 官方日K,正常 1-3 天
  shiller:
    cadence: monthly
    publish_grace_day: 5

# 數值合理性
sanity:
  vix_min: 5.0
  vix_max: 90.0          # 史上最高月收約 59(2008-10),日內最高 89.5(2020-03)
  max_monthly_gap_pct: 25.0   # 月對月跳空超過這個幅度就要人看一眼
  min_rows:
    sp_daily: 10000
    vix: 8000
    shiller: 1800

# PWA 部署健康
pwa:
  url: "https://marschannewtag-spec.github.io/mars-robot/"
  # 這些字串必須出現在線上的 index.html 裡。少了就代表部署回退或壞掉了。
  expect_markers:
    - "buildVixMonthly"
    - "vixRiskSeries"
    - "fetchT"
    - "readCache"
    - "ddspan"
    - "SP_MIRROR"          # 2026-10-19 起趨勢腿的第一順位來源;沒了就是退回代理鏈

  # PWA 真的去讀的那兩個檔(由 ops/src/publish_pwa.py 每日產生、推到 ops-data)。
  #
  # ⚠ 這兩個網址必須與 index.html 的 `SP_MIRROR` / `VIX_URL` 一致 —— 由
  #   tests/test_publish_pwa.py::test_config_mirror_urls_match_the_pwa 綁住。
  #   漂移的後果與代理清單漂移完全一樣:健檢盯著一個 PWA 沒在讀的檔案,
  #   而 PWA 在讀的那個沒人看著。
  mirror:
    sp_url: "https://raw.githubusercontent.com/marschannewtag-spec/mars-robot/ops-data/ops/data/pwa/sp_monthly.json"
    vix_url: "https://raw.githubusercontent.com/marschannewtag-spec/mars-robot/ops-data/ops/data/pwa/vix_daily.csv"
    # 健檢讀到的是【上一次執行】推上去的那一份(本次的 publish 在後面才跑),
    # 所以要容得下一個排程週期 + 週末 + 一次 outage。
    max_age_days: 5
    min_sp_months: 13       # SMA12 需要 13 個月才算得出第一個訊號
    min_vix_months: 132     # 歷史圖 96 個月 + 滾動 z 分數 36 個月

# PWA 實際在用的免金鑰代理鏈。
# 這是整套健檢最有價值的一項 —— allorigins 就是這樣無聲死掉、
# 導致趨勢腿默默退回月頻長達不知多久,而畫面上完全看不出來。
proxy_probe_target: "https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?interval=1d&range=1mo"
#
# ⚠ 這份清單必須與 index.html 的 `PROXIES` 一致 —— 由
#   tests/test_proxy_chain.py::test_pwa_proxy_list_matches_config 綁住。
#   漂移的後果是:健檢天天探測一個 PWA 沒在用的代理,而 PWA 在用的那個沒人看著。
#
# 2026-10-14 移除 allorigins。它從 2026-08 就列在下面的 known_dead_proxies 裡,
# 但 PWA 完全不知道,於是每次冷啟動對它白等 7s × 2 個主機 = 把 12 秒總預算燒光。
# 實測 4/4 次都是完整逾時,不是間歇。留著等於多一個只會拖時間的假備援。
proxies:
  - name: "corsproxy.io"
    template: "https://corsproxy.io/?url={url}"

# 已知且已接受的劣化 —— 列在這裡就不會每天報警。
# 新增項目時務必在 commit 訊息寫清楚為什麼可以接受,否則這裡會變成垃圾桶。
accepted:
  # Shiller 的 Dividend 與 Long Interest Rate 欄自 2023-07 起未發布(全為 0)。
  # 影響:總報酬回測窗口只能到 2023-06。已反映在黃金基準的窗口設定上。
  shiller_zero_columns_since: "2023-07"

  # 已知失效、但仍留在退回鏈裡的代理。列在這裡就不會每天報警,
  # 但若「剩下還活著的」也掛掉,PWA 代理鏈那一項仍然會失敗。
  #
  # 2026-10-14 清空:唯一的項目 allorigins 已從 proxies 清單整個移除,
  # 留一個指向不存在的代理的條目就是另一條「宣稱有、實際沒接」的死設定
  # (FRED 那個形狀)。要再加回來的話,proxies 與 index.html 的 PROXIES
  # 兩邊都要加 —— 測試會要求你加兩邊。
  #
  # ⚠ 現況:corsproxy.io 也已於 2026-08-28 起失效(轉為需 API key,回 HTTP 401),
  #   所以「PWA 代理鏈」這一項目前是【真的】紅燈,不是誤報。
  #   不要為了讓它變綠而把 corsproxy.io 加進這份清單 —— 那等於把警報關掉。
  #   正解是填 config 的 worker_url / PWA 的自架 Worker 欄位。
  known_dead_proxies: []

# 選填:自架 Cloudflare Worker 端點。留空則跳過該項檢查。
worker_url: ""
