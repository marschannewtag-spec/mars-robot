name: L1 每日資料健檢

# 平常完全靜默。偵測到異常才開 Issue,並(若已設定 API key)讓 Claude 診斷並開 PR。
#
# 安全設計 —— 請不要「順手」放寬這些限制:
#
# 1. **Claude 只由本流程自己的健檢報告觸發,絕不由使用者的 Issue 觸發。**
#    這個 repo 是公開的,任何人都能開 Issue。2026-06 已有公開的攻擊鏈:
#    開一個惡意 Issue -> agent 讀它 -> 交出 repo 寫入憑證。輸入必須是我們自己
#    產生且已淨化的文字,不能是外人可控的內容。
#
# 2. **Claude 的 contents:write 只用來推 fix/ 分支。** 擋住它動 main 的是
#    main 的分支保護(要求 CI 通過),那道保護是這個設計的承重牆,不是裝飾。
#
# 3. **心跳推到 ops-data 分支,不推 main。** 一來心跳 commit 不跑 CI、
#    會被分支保護擋下;二來不給任何自動流程碰 main 的理由。
#    推到任何分支都算 repo 活動,一樣能避免排程被停用。
#
# 4. **action 釘死 SHA。** 用 @main 或浮動標籤正是出事的那種用法。

on:
  schedule:
    - cron: "0 22 * * *" # 每天 UTC 22:00(美股收盤後)
  workflow_dispatch:
    inputs:
      drill:
        description: "演練:健檢正常時也強制跑一次自動修復,驗證整條鏈接得起來"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: daily-health
  cancel-in-progress: false

jobs:
  health:
    name: 資料源 · 新鮮度 · 合理性 · PWA
    runs-on: ubuntu-latest
    permissions:
      contents: write # 只用來推 ops-data 分支;main 由分支保護擋住
      issues: write
    outputs:
      # ⚠ 不是直接取 steps.check.outputs.code。
      # 依賴安裝失敗時「執行健檢」根本不會跑,那個值會是**空字串** ——
      # 而空字串在 `!= '0'` 下為真、在 `== '0'` 下為假,於是下游每一個條件
      # 都會拿到一個沒有人決定過的答案。健康碼必須由一個一定會執行的步驟
      # 明確寫出來,見「決定本次的健康碼」。
      code: ${{ steps.code.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/requirements.txt

      # ⚠ 這裡【只裝 L1 執行期相依】,不裝 pytest / pytest-cov。
      #
      # 2026-10-19 之前兩者在同一份 requirements.txt 裡,也就是說:
      # **pytest 的一次解析失敗,有能力讓每日資料供應停擺。** 測試工具對這條
      # 路徑毫無貢獻,就不該出現在它的故障範圍裡。測試工具見
      # ops/requirements-test.txt,L2 的精確鎖定見 ops/requirements-ci.lock。
      #
      # `continue-on-error` 在這裡【不是】為了讓紅燈變綠:它是為了讓後面的
      # 失敗處理步驟跑得到。原本安裝失敗會直接讓 job 中止,於是開 Issue 那一步
      # 被跳過(它的條件不含 always()),心跳也沒有新資料可推 ——
      # 結果是「workflow 紅了但 Issue 安靜、repo 沒有活動」,而那會讓
      # GitHub 的 60 天排程停用計時器開始跑。健康碼仍然會被設成非零,
      # 見下面「決定本次的健康碼」。
      #
      # log 重導向到一個【這一步自己新建】的檔案,不是重導向到任何下游會讀的
      # 既有檔案 —— shell 的重導向會在命令執行之前就把目的檔清空,這個專案
      # 已經被那件事咬過一次(health_log.csv 變成一張沒有表頭的空表)。
      - name: 安裝 L1 執行期相依(不含測試工具)
        id: install
        continue-on-error: true
        run: |
          set +e
          {
            python -m pip install --upgrade pip
            pip install -r ops/requirements.txt
          } > "$GITHUB_WORKSPACE/dep_install.log" 2>&1
          code=$?
          set -e
          cat "$GITHUB_WORKSPACE/dep_install.log"
          echo "pip_version=$(python -m pip --version 2>/dev/null | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          exit $code

      # 成功路徑也要留軌跡。只在失敗時才記錄的話,出事那天沒有東西可以比對 ——
      # 而「跟昨天的版本組合差在哪」正是歸因唯一需要的資訊。
      - name: 記錄實際安裝的版本(成功路徑)
        if: steps.install.outcome == 'success'
        env:
          PIP_VERSION: ${{ steps.install.outputs.pip_version }}
          PYTHONIOENCODING: utf-8
        run: |
          python ops/src/dep_manifest.py --phase success \
            --source ops/requirements.txt \
            --requested ops/requirements.txt \
            --out ops/data/deps/install.json

      # 安裝失敗 → 寫 failure manifest + 開/更新 Issue。
      # 這一步存在的唯一理由:**安裝失敗必須是一個看得見的健康事件**,
      # 不能只有一封 GitHub 的 workflow 失敗信。
      - name: 依賴安裝失敗 → manifest 與 Issue
        if: steps.install.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PIP_VERSION: ${{ steps.install.outputs.pip_version }}
          PYTHONIOENCODING: utf-8
        run: |
          # dep_manifest.py 只用標準庫,所以它在「pandas 裝不起來」之後仍然跑得動。
          python ops/src/dep_manifest.py --phase failure \
            --source ops/requirements.txt \
            --requested ops/requirements.txt \
            --log "$GITHUB_WORKSPACE/dep_install.log" \
            --exit-code 1 \
            --out ops/data/deps/install.json \
            --emit-issue \
            --issue-title "$GITHUB_WORKSPACE/dep_issue_title.txt" \
            --issue-body "$GITHUB_WORKSPACE/dep_issue_body.md"

          gh label create health-fail --color B60205 \
            --description "每日健檢偵測到的異常" 2>/dev/null || true

          title=$(cat "$GITHUB_WORKSPACE/dep_issue_title.txt")
          # 去重沿用既有的那一個不變量:永遠只有一張開放的 health-fail Issue。
          # 內文帶著 failset 標記(依賴安裝),所以恢復正常那天會被既有的
          # 「恢復正常 → 關閉 Issue」步驟自動關掉,不會變成孤兒。
          existing=$(gh issue list --label health-fail --state open --limit 1 \
                       --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --label health-fail \
              --body-file "$GITHUB_WORKSPACE/dep_issue_body.md"
          else
            # 先讀舊內文再覆蓋 —— 判斷「上次是不是同一個原因」要用舊的那一份。
            gh issue view "$existing" --json body --jq .body > old_body.md || true
            gh issue edit "$existing" --title "$title" \
              --body-file "$GITHUB_WORKSPACE/dep_issue_body.md"
            # 只在「上次不是依賴安裝失敗」時留言。連續失敗不重複出聲,
            # 同既有的「失敗集合沒變就不留言」那條規則 —— 每天留一則會把
            # Issue 洗成沒人看的討論串,而這個專案實測過那個後果(52 則留言)。
            if ! grep -q "failset: 依賴安裝" old_body.md 2>/dev/null; then
              gh issue comment "$existing" \
                --body "依賴安裝失敗,健檢未執行(詳見內文)。"
            fi
          fi

      # 健檢軌跡累積在 ops-data 分支上,先取回來再追加,否則每天都會從零開始
      # ⚠ 兩個細節都是踩過的:
      #
      # 1. fetch 要用【明確的 refspec】。`git fetch origin ops-data` 只保證寫
      #    FETCH_HEAD;remote-tracking ref 要不要順手建出來,取決於
      #    remote.origin.fetch 有沒有涵蓋它 —— 而 actions/checkout 會把它縮窄成
      #    只有當前分支。明確寫成 +refs/heads/ops-data:refs/remotes/origin/ops-data
      #    就不用賭。
      #
      # 2. **不成功就不要碰目的檔。** 原本是
      #    `git show ... > ops/data/health_log.csv`,而 shell 的重導向是在
      #    git show 執行【之前】就把目的檔截斷成 0 bytes。所以那一行只要失敗,
      #    留下的就是一個存在但空的軌跡檔;append_log 接著判定「表頭已經有了」
      #    而直接追加一列,整份 CSV 從此沒有表頭,下一次 pd.read_csv 會把那一列
      #    當成欄位名 —— 稽核軌跡靜靜變成一張空表,而沒有任何東西會紅。
      #    改成先寫暫存檔、確認非空才搬過去。
      #    (append_log 那一邊也補了同一道防線,兩邊獨立,見
      #     test_an_empty_log_file_still_gets_a_header。)
      - name: 取回既有的健檢軌跡
        if: steps.install.outcome == 'success'
        run: |
          mkdir -p ops/data
          if ! git fetch origin +refs/heads/ops-data:refs/remotes/origin/ops-data 2>/dev/null; then
            echo "ops-data 分支尚不存在,將由本次建立"
            exit 0
          fi
          keep=$(mktemp -d)
          if git show origin/ops-data:ops/data/health_log.csv > "$keep/health_log.csv" 2>/dev/null \
             && [ -s "$keep/health_log.csv" ]; then
            mv "$keep/health_log.csv" ops/data/health_log.csv
            echo "已取回 $(wc -l < ops/data/health_log.csv) 行軌跡"
          else
            echo "分支上尚無軌跡檔(或取回失敗)—— 保持本機原狀,不覆蓋"
          fi
          if git show origin/ops-data:ops/data/manifest.json > "$keep/manifest.json" 2>/dev/null \
             && [ -s "$keep/manifest.json" ]; then
            mv "$keep/manifest.json" ops/data/manifest.json
          fi

      # ⚠ 條件是明寫的,不是靠「反正它自己會失敗」。
      # `continue-on-error` 讓安裝失敗的步驟 conclusion 變成 success,
      # 所以後面的步驟【仍然會執行】。而這一步的 `set +e` 會把
      # ModuleNotFoundError 變成 code=1 然後自己 exit 0 ——
      # 也就是會產出一個「1 項異常」的假結果,以及一個空的 health_report.md。
      # 失敗路徑要明寫,不要讓它看起來像一次正常的健檢。
      - name: 執行健檢
        id: check
        if: steps.install.outcome == 'success'
        working-directory: ops
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          python src/health_check.py --markdown > "$GITHUB_WORKSPACE/health_report.md"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "健檢結束,exit code = $code"

      # 體制層(主體判定 + 早期警訊)。PWA 讀的是這一步產出的 signals.json。
      #
      # `continue-on-error`:這層是輔助讀數,不該有能力讓每日健檢變紅燈。
      # CNN 或國發會今天抽風不是「系統壞了」——真正的資料源健康由上一步負責,
      # 而 signals.json 若過期,PWA 自己會在面板上標出資料年齡。
      - name: 產生體制訊號(輔助層,失敗不影響健檢結果)
        continue-on-error: true
        if: steps.install.outcome == 'success'
        working-directory: ops
        env:
          PYTHONIOENCODING: utf-8
        run: python src/fetch_signals.py

      # PWA 讀的資料鏡像。這一步【取代了免費 CORS 代理】——
      # 瀏覽器抓不到 Yahoo/CBOE(沒有 ACAO 標頭),而免費代理在 2026-10 全死,
      # 於是趨勢腿每天默默退回 Shiller 月均價(與回測基準不同的定義)。
      # 現在由這裡在 server 端抓好(沒有 CORS 問題),推到 ops-data,
      # 瀏覽器直接讀 raw.githubusercontent.com(送 ACAO: *)。
      #
      # ⚠ 必須排在「執行健檢」之後 —— 它讀的是健檢剛落地的 data/raw/*.csv。
      #
      # `continue-on-error`:這一層失敗時 PWA 會沿用分支上的舊版鏡像,
      # 而「舊版有多舊」由健檢的 `PWA 資料鏡像` 兩項負責報告(讀線上那一份)。
      # 讓它有能力把每日健檢變紅燈的話,一次暫時性失敗就會蓋掉資料源的真實訊號。
      - name: 產生 PWA 資料鏡像(失敗不影響健檢結果)
        continue-on-error: true
        if: steps.install.outcome == 'success'
        working-directory: ops
        env:
          PYTHONIOENCODING: utf-8
        run: python src/publish_pwa.py

      # 健檢全綠時 --markdown 不輸出內容,補一行說明,讓演練模式也有東西可讀
      # 健康碼必須由一個【一定會執行】的步驟寫出來。
      # 安裝失敗時「執行健檢」沒跑,steps.check.outputs.code 是空字串,
      # 而空字串會讓下游條件得到一個沒人決定過的答案 —— 那正是這次要修的洞。
      - name: 決定本次的健康碼
        id: code
        if: always()
        run: |
          if [ "${{ steps.install.outcome }}" != "success" ]; then
            # 90 是「依賴安裝失敗」的專用碼。health_check.py 的 exit code 是
            # 失敗項目數(目前最多約 19 項),所以兩者不會混淆。
            echo "code=90" >> "$GITHUB_OUTPUT"
            echo "依賴安裝失敗 → 健康碼 90"
          else
            echo "code=${{ steps.check.outputs.code }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 補齊報告內容(健檢正常時)
        if: steps.code.outputs.code == '0'
        run: |
          echo "本次健檢全部通過,沒有偵測到任何異常。" > "$GITHUB_WORKSPACE/health_report.md"

      # 交給 autofix job 用。jobs 之間不共用檔案系統,只能走 artifact。
      - name: 保存健檢報告
        if: steps.install.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: health_report.md
          retention-days: 7

      # 依賴 manifest 在成功與失敗路徑都要保存 —— 失敗那天的那一份才是
      # 最需要被讀到的。`if: always()` 不是裝飾:少了它,安裝失敗時這個
      # artifact 會跟著被跳過,而那正是唯一有診斷價值的輸出。
      - name: 保存依賴 manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-manifest
          path: |
            ops/data/deps/install.json
            dep_install.log
          retention-days: 30
          if-no-files-found: warn

      - name: 確保標籤存在
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create health-fail \
            --color B60205 \
            --description "每日健檢偵測到的異常" 2>/dev/null || true

      # 去重:資料源掛掉是【持續性狀態】不是單次事件。每天開新 Issue 等於一年 365 個,
      # 而使用者會直接關掉通知 —— 那整層就白做了。所以永遠只有一個 Issue。
      #
      # ⚠ 2026-10-14 修掉一個把這個設計整個抵銷掉的缺陷。
      #
      # 原本的去重 key 是「有沒有開放的 health-fail Issue」,不是「哪幾項在失敗」。
      # 實測後果:Issue #2 從 2026-08-21 連紅 54 天、52 則留言,而這段期間
      # 失敗項目換過 6 次 —— 包含兩個真正影響使用者看到的數字的新故障
      # (代理鏈全部失效、VIX 來源停更)。它們以「第 N 則留言」的形式出現在一個
      # 已經 52 則的討論串裡,而標題仍然凍結在第一個、而且早就自己好了的原因。
      #
      # 「狼來了比漏報更致命」(config.yml 開頭)。連紅 54 天的 Issue 就是那個
      # 狼來了:它每天都正確地報告了事實,而資訊傳達完全失敗。
      #
      # 修法【不動】只有一個 Issue 這條不變量,改的是報告層:
      #   1. 內文每次都換成當前報告(而不是永遠停在第一天那一份)
      #   2. 標題寫出【目前】在失敗的是什麼
      #   3. 只在失敗集合【變動】時留言,並明確列出新增/恢復
      # 逐日軌跡本來就有 health_log.csv 當 append-only 稽核軌跡,不靠留言。
      #
      # 判斷邏輯放在 src/health_check.py(有測試),這裡只負責編排 ——
      # 寫在 workflow 的 heredoc 裡就沒辦法測。
      # ⚠ 條件多了 `steps.install.outcome == 'success'`。
      # 安裝失敗時這一步【不能】跑:health_report.md 不存在,而且
      # `--issue-plan` 需要 pandas/yaml —— 也就是需要那個剛剛裝失敗的東西。
      # 那條路徑的 Issue 由上面的「依賴安裝失敗」步驟負責,用的是只靠標準庫的
      # dep_manifest.py。
      - name: 異常 → 開或更新 Issue
        if: steps.code.outputs.code != '0' && steps.install.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
        run: |
          existing=$(gh issue list --label health-fail --state open --limit 1 \
                       --json number --jq '.[0].number // empty')

          # 既有 Issue 的內文裡藏著上次的失敗集合(failset 標記)。
          # 舊格式的 Issue 沒有那個標記 → 視為「不知道」→ 會留一次言說明現況。
          : > old_body.md
          if [ -n "$existing" ]; then
            gh issue view "$existing" --json body --jq .body > old_body.md
          fi

          plan=$(python ops/src/health_check.py --issue-plan \
                   "$GITHUB_WORKSPACE/health_report.md" old_body.md)
          changed=$(printf '%s' "$plan" | jq -r .changed)
          title=$(printf '%s' "$plan" | jq -r .title)
          printf '%s' "$plan" | jq -r .comment > change_comment.md
          # ⚠ 寫進 Issue 的是 plan 回傳的 body,不是原始報告 ——
          #    它比報告多了狀態標記(每一項第一次失敗的日期、上次已通知的等級、
          #    上次留言日)。少了那些,下一次執行就不知道「這一項壞多久了」,
          #    嚴重程度跨級與週期提醒會整個失效,而且完全無聲。
          printf '%s' "$plan" | jq -r .body > issue_body.md

          if [ -z "$existing" ]; then
            echo "沒有開放的 Issue,新建:$title"
            gh issue create --title "$title" --label health-fail \
              --body-file issue_body.md
            exit 0
          fi

          # 內文每次都換成最新狀態。少了這一步,Issue 內文會永遠停在第一天那一份,
          # 而使用者點進來看到的是一份早就不成立的報告。
          gh issue edit "$existing" --title "$title" --body-file issue_body.md

          if [ "$changed" = "true" ]; then
            echo "有值得出聲的變化 → 留言並更新標題"
            gh issue comment "$existing" --body-file change_comment.md
          else
            echo "失敗集合沒變、嚴重程度沒跨級、也還沒到提醒週期 → 只更新內文,不留言"
            echo "(每天留一則「仍未恢復」會把 Issue 洗成沒人看的討論串,"
            echo " 那等於把整層監控關掉 —— 逐日軌跡看 health_log.csv)"
          fi

      - name: 恢復正常 → 關閉 Issue
        if: steps.code.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label health-fail --state open \
                       --json number --jq '.[].number'); do
            echo "關閉 #$n"
            gh issue close "$n" \
              --comment "健檢已恢復正常($(date -u '+%Y-%m-%d %H:%M UTC')),自動關閉。"
          done

      # 心跳:即使健檢失敗也要跑,否則「來源掛掉」會連帶讓排程被停用,
      # 變成故障期間反而失去監控 —— 最糟的失效模式。
      # ⚠ 獨立的收尾步驟,刻意【不讀】 steps.code。
      #
      # 它回答的問題和 manifest.json 不一樣:
      #
      #   manifest.json 的 fetched_at = 「資料」有多新
      #   heartbeat.txt               = 「監控本身」今天有沒有來報到
      #
      # 2026-10-20 之前只有前者。於是健檢失敗那天沒有任何資料檔變動 ->
      # `git diff --cached --quiet` 為真 -> commit 被跳過 -> repo 沒有活動,
      # 而 GitHub 停用排程的 60 天倒數繼續走。**最需要心跳的那一天,
      # 正好是心跳消失的那一天。**
      #
      # 位置放在健檢之後是刻意的(符合「健檢結果確定後才更新」),
      # 但它的內容不依賴健檢結果 —— 依賴了就會重蹈覆轍。
      - name: 心跳時間戳(與健檢成敗無關)
        if: always()
        run: |
          mkdir -p ops/data
          # 單行 UTC ISO 8601。格式由 tests/test_heartbeat.py 真的執行這行指令驗證。
          date -u '+%Y-%m-%dT%H:%M:%SZ' > ops/data/heartbeat.txt
          echo "心跳時間戳:$(cat ops/data/heartbeat.txt)"

      - name: 心跳 — 推資料到 ops-data 分支
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tmp=$(mktemp -d)
          cp ops/data/heartbeat.txt   "$tmp/" 2>/dev/null || true
          cp ops/data/manifest.json   "$tmp/" 2>/dev/null || true
          cp ops/data/health_log.csv  "$tmp/" 2>/dev/null || true
          cp ops/data/signals.json    "$tmp/" 2>/dev/null || true
          mkdir -p "$tmp/pwa"
          cp ops/data/pwa/*            "$tmp/pwa/" 2>/dev/null || true
          mkdir -p "$tmp/deps"
          cp ops/data/deps/*           "$tmp/deps/" 2>/dev/null || true

          # `A && B || C` 的陷阱:B 失敗時 C 也會跑。這裡 C 是「從目前的 HEAD
          #(也就是 main)開一條新的 ops-data」—— 那會讓接下來的 push 變成非快轉
          # 而被拒,整個步驟紅掉。寫成 if/else,並且 fetch 用明確 refspec,
          # 讓「分支不存在」和「fetch 失敗」不要長得一樣。
          if git fetch origin +refs/heads/ops-data:refs/remotes/origin/ops-data 2>/dev/null; then
            git checkout -f -B ops-data origin/ops-data
          else
            echo "ops-data 尚不存在,由本次建立"
            git checkout -f -B ops-data
          fi
          mkdir -p ops/data
          cp "$tmp"/heartbeat.txt  ops/data/ 2>/dev/null || true
          cp "$tmp"/manifest.json  ops/data/ 2>/dev/null || true
          cp "$tmp"/health_log.csv ops/data/ 2>/dev/null || true
          # signals.json 產生失敗時上面那步不會有檔案,cp 失敗就沿用分支上的舊版 ——
          # 舊資料好過沒資料,PWA 會自己把年齡標出來
          cp "$tmp"/signals.json   ops/data/ 2>/dev/null || true
          mkdir -p ops/data/pwa
          cp "$tmp"/pwa/*          ops/data/pwa/ 2>/dev/null || true
          # 依賴 manifest 走同一條持久化路徑。安裝失敗那天它是**唯一**會變動的
          # 檔案,所以它也是那天唯一能讓心跳真的 commit 的東西 ——
          # 而「有 commit」就是排程不被 GitHub 自動停用的條件。
          mkdir -p ops/data/deps
          cp "$tmp"/deps/*         ops/data/deps/ 2>/dev/null || true

          # heartbeat.txt 放第一個不是排版 —— 它是唯一保證每次都會變的檔案,
          # 也就是唯一保證這個 commit 一定成立的東西。
          git add -f ops/data/heartbeat.txt 2>/dev/null || true
          git add -f ops/data/manifest.json ops/data/health_log.csv 2>/dev/null || true
          git add -f ops/data/signals.json 2>/dev/null || true
          # 鏡像是 PWA 的第一順位來源 —— 這一行沒推上去,使用者就讀到舊資料
          git add -f ops/data/pwa 2>/dev/null || true
          git add -f ops/data/deps 2>/dev/null || true
          # ⚠ 這裡【不得】因為「沒有變化」就跳過 —— 那正是 60 天懸崖的失效路徑。
          #
          # heartbeat.txt 每次執行都會變,所以 diff 為空本身就是異常訊號
          # (時間戳那步沒跑成功,或搬運掉了)。那種時候更要留下一個 commit:
          # 排程活不活得下去,不該取決於今天有沒有新資料。
          #
          # push 刻意放在 if/else 外面 —— 放進 else 就是把同一個 bug
          # 換一個地方再寫一次。
          if git diff --cached --quiet; then
            echo "::warning::heartbeat.txt 沒有變化,時間戳可能沒寫成功。仍送出空 commit 以維持 repo 活動。"
            git commit --allow-empty -m "chore: 每日心跳(無檔案變動)$(date -u '+%Y-%m-%d')"
          else
            git commit -m "chore: 每日資料心跳 $(date -u '+%Y-%m-%d')"
          fi
          git push origin ops-data

      - name: 摘要
        if: always()
        run: |
          code="${{ steps.code.outputs.code }}"
          if [ "$code" = "0" ]; then
            echo "✅ 所有檢查通過" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$code" = "90" ]; then
            {
              echo "❌ **依賴安裝失敗,健檢未執行。**"
              echo ""
              echo "這不是「資料源壞了」,是「我們今天沒有能力去看資料源」。"
              echo "已開/更新 health-fail Issue;完整 manifest 見 artifact dependency-manifest。"
              echo ""
              echo '```'
              tail -40 "$GITHUB_WORKSPACE/dep_install.log" 2>/dev/null \
                || echo "(連安裝 log 都沒有 —— 這本身就是線索)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ 偵測到異常,詳見 Issue" >> "$GITHUB_STEP_SUMMARY"
            # 報告產生那一步若沒有留下輸出,這裡也要留下看得見的錯誤,
            # 而不是讓摘要變成一片空白。
            cat "$GITHUB_WORKSPACE/health_report.md" >> "$GITHUB_STEP_SUMMARY" \
              || echo "⚠️ 找不到 health_report.md —— 報告產生那一步沒有留下輸出" \
                   >> "$GITHUB_STEP_SUMMARY"
          fi

  autofix:
    name: Claude 診斷並開 PR
    needs: health
    # ⚠ 刻意排除 90(依賴安裝失敗)。那條路徑叫 Claude 來沒有意義:
    # 它自己的 job 也要跑 `pip install`,會在同一個地方失敗;而且它拿到的輸入是
    # health_report.md,那份報告在安裝失敗時不存在。
    # 依賴問題的診斷資訊在 dependency-manifest artifact 裡,給人看。
    if: (needs.health.outputs.code != '0' && needs.health.outputs.code != '90') || inputs.drill
    runs-on: ubuntu-latest
    # 自動修復失敗不該讓整個 run 變紅。這兩層的語意必須分開:
    #   run 顏色 = 自動化本身有沒有壞
    #   Issue    = 資料健不健康
    # 混在一起的話,每次健檢異常都會同時出現紅燈,而紅燈看久了就會被無視 ——
    # 對一個「沒消息就是好消息」的系統,那等於把整層關掉。
    continue-on-error: true
    permissions:
      contents: write # 只推 fix/ 分支;main 由分支保護擋住
      pull-requests: write
      issues: write
      id-token: write # claude-code-action 用 OIDC 換 App token,少了這個會直接失敗
    steps:
      # 兩種認證都支援,沒設就安靜跳過,讓整套系統在未啟用時仍然可用。
      #
      # CLAUDE_CODE_OAUTH_TOKEN 走 Pro/Max 訂閱額度,不另外計費 —— 優先用它。
      # ANTHROPIC_API_KEY 是按 token 計費的 API 額度,當備援。
      # 兩者不可同時傳給 action(靜態憑證會互相搶),所以下面用三元運算只傳一個。
      - name: 檢查是否已啟用
        id: guard
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ]; then
            echo "enabled=true"  >> "$GITHUB_OUTPUT"
            echo "mode=oauth"    >> "$GITHUB_OUTPUT"
            echo "🔑 使用 CLAUDE_CODE_OAUTH_TOKEN(Pro/Max 訂閱額度)" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$KEY" ]; then
            echo "enabled=true"  >> "$GITHUB_OUTPUT"
            echo "mode=apikey"   >> "$GITHUB_OUTPUT"
            echo "🔑 使用 ANTHROPIC_API_KEY(按量計費)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "⏭ 未設定 CLAUDE_CODE_OAUTH_TOKEN 或 ANTHROPIC_API_KEY,略過自動修復。" \
              >> "$GITHUB_STEP_SUMMARY"
            echo "健檢 Issue 已開,請手動處理。設定方式見 ops/SETUP.md。" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          name: health-report

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.enabled == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: "22"

      - name: 安裝相依
        if: steps.guard.outputs.enabled == 'true'
        run: |
          # autofix 要跑 pytest,所以它需要【兩份】宣告 —— 這是唯一需要
          # 測試工具的 job。L1 的健檢 job 不裝它們。
          pip install -r ops/requirements.txt -r ops/requirements-test.txt
          npm ci --prefix ops

      # 釘死 SHA。v1.0.186 —— 遠高於修掉 Issue 注入漏洞的 v1.0.94。
      # 絕對不要改成 @main 或 @v1:那是浮動參照,正是 2026-06 出事的用法。
      - name: Claude 診斷並修復
        if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@c038e4dcdedfbbca18dfb17df35a17e40ded4ddc # v1.0.186
        with:
          # 只會有一個非空 —— 見上面 guard 步驟的說明
          claude_code_oauth_token: ${{ steps.guard.outputs.mode == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ steps.guard.outputs.mode == 'apikey' && secrets.ANTHROPIC_API_KEY || '' }}
          # 明確傳入內建的 GITHUB_TOKEN,避免走 OIDC 去換官方 Claude GitHub App 的
          # token —— 那條路需要在 repo 上安裝該 App。這個 token 的權限由上面的
          # permissions 決定,一樣推不動 main(分支保護)。
          github_token: ${{ github.token }}
          prompt: |
            你是這個 repo 的維運工程師。每日健檢失敗了,報告在 `health_report.md`。

            工程規格與系統不變量見 `ops/CLAUDE.md`,動手前先讀。

            ## 任務

            1. 讀 `health_report.md`,判斷失敗的真正原因。
            2. **先判斷這是不是程式問題。** 很多失敗是外部資料源暫時故障
               (來源停更、代理逾時、上游改格式)。那些不是 bug。
            3. 若確實是程式問題:只修那一個問題,不要順手改別的。
            4. 在 `ops/` 下跑 `python -m pytest tests/ -q`,必須全過。
            5. 開一個 PR,標題以 `fix:` 開頭,說明裡寫清楚:
               根因是什麼、你改了什麼、為什麼這樣改、以及你不確定的地方。

            ## 絕對不可以做的事

            - **不要放寬健檢的閾值來讓檢查通過。** 那等於把警報關掉。
              如果閾值真的訂得太緊,在 PR 說明裡提出理由讓人決定,不要自己改。
            - **不要修改 `ops/tests/fixtures/` 的黃金基準。** 基準漂移代表有東西
              壞了;改基準等於湮滅證據。若你認為基準真的該變,在 PR 說明陳述理由。
            - **不要修改 `.github/workflows/` 底下任何檔案。**
            - **不要 push 到 main。** 只在 `fix/` 開頭的分支上工作。
            - **不要印出、複製或以任何形式外洩 secret。**
            - 若原因是外部資料源故障,不要為了讓 CI 綠燈而動程式碼。
              直接在 PR 或健檢 Issue 留言說明現況即可。

            ## 判斷不了就說不知道

            資訊不足以定位根因時,不要猜著改。開一個只有說明、沒有程式碼改動的
            PR,或在健檢 Issue 留言列出你查到的事實與還缺什麼。
            **報告事實比硬修一個你不確定的東西有價值得多。**
          claude_args: |
            --max-turns 40

      # 失敗時只挖出錯誤欄位。刻意不開 show_full_output —— 這是公開 repo,
      # workflow log 是公開的,把 Claude 的完整輸出印出來風險太大。
      - name: 失敗診斷(只印錯誤欄位)
        if: failure() && steps.guard.outputs.enabled == 'true'
        run: |
          f=/home/runner/work/_temp/claude-execution-output.json
          if [ ! -f "$f" ]; then echo "找不到 $f"; exit 0; fi
          python3 - "$f" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          if isinstance(d, list):
              d = d[-1] if d else {}
          for k in ("type", "subtype", "is_error", "num_turns",
                    "total_cost_usd", "error", "result", "message"):
              if k in d:
                  v = str(d[k])
                  print(f"{k}: {v[:600]}")
          PY

      - name: 自動修復失敗的說明
        if: failure() && steps.guard.outputs.enabled == 'true'
        run: |
          {
            echo "### ⚠️ 自動修復沒有跑成功"
            echo
            echo "**健檢本身正常運作** — 失敗的只有 Claude 這一步(見上一個 job)。"
            echo "資料健康狀況以 Issue 為準,不是以這個 run 的顏色為準。"
            echo
            echo "最常見的原因是認證:API 額度用盡、或 token 過期。"
            echo "處理方式見 \`ops/SETUP.md\` 的「認證」一節。"
          } >> "$GITHUB_STEP_SUMMARY"
