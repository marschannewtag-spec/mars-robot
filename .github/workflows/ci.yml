name: L2 邏輯一致性

# 每次改到計算邏輯就跑。這一層【完全離線】—— 全部吃 ops/tests/fixtures/ 的凍結快照,
# 不碰任何外部資料源。這是刻意的:否則 Yahoo 某天抽風就會讓 CI 變紅燈,
# 你就分不清是「邏輯壞了」還是「資料源不舒服」。資料源的死活由 L1 每日健檢負責。

on:
  push:
    paths:
      - "index.html"
      - "ops/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "index.html"
      - "ops/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 不變量 · 三方一致性 · 黃金基準
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是必要的 —— 預設只抓一個 commit,底下那個 SW 版本檢查要
      # 比對 github.event.before 與 github.sha,那個 before commit 不在淺層 clone 裡,
      # git diff 會失敗、被 2>/dev/null 吞掉、判斷永遠為 false。
      # 也就是說檢查會【安靜地永遠不觸發】—— 那比沒有檢查更糟,因為看起來有在把關。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/requirements-ci.lock

      # jsdom 用來載入線上真的在跑的 index.html,取出它自己的函式做逐月比對
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ops/package-lock.json

      # L2 用【精確鎖定 + hash 驗證】,L1 用版本範圍。兩邊不同是刻意的:
      #
      #   L2 的工作是回答「邏輯有沒有被改壞」。它必須是一個不會自己變動的量尺 ——
      #   否則某天 pip 裝到新版、黃金基準漂了 1e-9,紅燈的真正原因是「裝到新版」,
      #   而它會偽裝成「程式被改壞了」。那是最難歸因的一類紅燈。
      #
      #   L1 的工作是每天把資料生出來。把精確鎖定放在它的關鍵路徑上,會讓
      #   lockfile 過期、檔案被刪除、未來平台沒有對應 wheel 這些事變成
      #   **每日資料供應故障**。那條路徑要的是「裝得起來」,不是「逐位元一致」。
      #
      # 鎖定檔由 requirements.txt + requirements-test.txt 一起解析產生,
      # 生成工具與指令釘死在 ops/DEPENDENCIES.md 與 dependency-canary.yml。
      - name: 安裝相依(精確鎖定 + hash 驗證)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r ops/requirements-ci.lock
          npm ci --prefix ops

      # 入口與 dependency canary 共用(ops/scripts/ci_checks.sh)。
      # 兩邊各寫一套 pytest 指令的話,canary 遲早會在測一組與這裡不同的檢查 ——
      # 那是一個看起來在把關、實際上在量別的東西的閘門。
      - name: 跑測試
        run: bash ops/scripts/ci_checks.sh -v --tb=short

      # 提醒而非強制:漏 bump 不會讓 CI 失敗(有時 index.html 的改動確實不需要),
      # 但會在 summary 留下明顯的提示。強制的話會讓人養成盲目 bump 的習慣。
      - name: 檢查 index.html 改動是否伴隨 SW 版本 bump
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          # 新分支的第一次 push,before 會是全 0
          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "ℹ️ 找不到前一個 commit($before),略過 SW 版本檢查。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          changed=$(git diff --name-only "$before" "${{ github.sha }}")
          echo "本次改動:$(echo "$changed" | tr '\n' ' ')"
          if echo "$changed" | grep -qx "index.html"; then
            if echo "$changed" | grep -qx "sw.js"; then
              echo "✅ index.html 有改,sw.js 也一起改了" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "⚠️ **index.html 改了但 sw.js 沒改** — 確認是否該 bump \`CACHE\` 版本號,否則已安裝的使用者可能吃到舊殼。" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
