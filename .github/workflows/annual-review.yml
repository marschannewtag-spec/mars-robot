name: L3 年度健檢

# 一年跑一次,手動觸發。跑完會把報告 commit 進 reports/ 並開一個 Issue 通知你去讀。
# 這是整套系統唯一需要你花時間的地方 —— 大約 15 分鐘。
#
# 報告只陳述數字與偏離,不建議調參。若它說「參數已漂出穩健區」,
# 那個「要不要調整」的決定是你的。

on:
  workflow_dispatch:
    inputs:
      open_issue:
        description: "跑完是否開 Issue 提醒你去讀"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

jobs:
  review:
    name: 產出年度健檢報告
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/requirements.txt

      - name: 安裝相依
        run: |
          python -m pip install --upgrade pip
          pip install -r ops/requirements.txt

      # 「資料源穩定度」那一節需要每日健檢累積的軌跡,而軌跡放在 ops-data 分支
      # (心跳刻意不推 main —— 見 daily-health.yml 的說明)
      - name: 取回健檢軌跡
        run: |
          mkdir -p ops/data
          if git fetch origin ops-data 2>/dev/null; then
            git show origin/ops-data:ops/data/health_log.csv > ops/data/health_log.csv 2>/dev/null \
              && echo "已取回 $(wc -l < ops/data/health_log.csv) 行軌跡" \
              || echo "分支上尚無軌跡檔 —— 報告的資料源穩定度一節會是空的"
          else
            echo "ops-data 分支尚不存在 —— 每日健檢還沒跑過"
          fi

      - name: 產出報告
        id: report
        working-directory: ops
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python src/annual_review.py
          echo "path=ops/reports/$(date -u +%Y)-health.md" >> "$GITHUB_OUTPUT"

      - name: 放進 workflow summary
        run: cat "${{ steps.report.outputs.path }}" >> "$GITHUB_STEP_SUMMARY"

      - name: 保存為 artifact
        uses: actions/upload-artifact@v4
        with:
          name: annual-health-report
          path: ${{ steps.report.outputs.path }}
          retention-days: 90

      # 報告推到 ops-data 分支,不推 main —— main 有分支保護且要求 CI 通過,
      # 而報告 commit 不該去跑一輪 CI。報告已同時存成 artifact 與 workflow summary。
      - name: Commit 報告到 ops-data 分支
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp=$(mktemp -d) && cp -r ops/reports "$tmp/"
          git fetch origin ops-data 2>/dev/null \
            && git checkout -f -B ops-data origin/ops-data \
            || git checkout -f -B ops-data
          mkdir -p ops && cp -r "$tmp/reports" ops/
          git add -f ops/reports/
          if git diff --cached --quiet; then
            echo "報告內容無變化,跳過 commit"
          else
            git commit -m "報告: 年度健檢 $(date -u +%Y)"
            git push origin ops-data
          fi

      - name: 開 Issue 提醒閱讀
        if: inputs.open_issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "年度健檢報告已產出:[\`${{ steps.report.outputs.path }}\`](../blob/main/${{ steps.report.outputs.path }})"
            echo
            echo "請花 15 分鐘讀完。重點看兩件事:"
            echo
            echo "1. **基準漂移** — 訊號層若有任何差異,那是 bug,不是市場變化。"
            echo "2. **參數敏感度** — 現行參數還在不在高原上。"
            echo
            echo "報告只陳述數字,不建議調參。要不要動是你的決定。"
            echo
            echo "<details><summary>完整報告</summary>"
            echo
            cat "${{ steps.report.outputs.path }}"
            echo
            echo "</details>"
          } > issue_body.md
          gh issue create \
            --title "年度健檢 $(date -u +%Y) · 待閱讀" \
            --body-file issue_body.md
