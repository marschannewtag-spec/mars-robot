name: L3 年度健檢

# 一年跑一次,手動觸發。跑完會把報告 commit 進 reports/ 並開一個 Issue 通知你去讀。
# 這是整套系統唯一需要你花時間的地方 —— 大約 15 分鐘。
#
# 報告只陳述數字與偏離,不建議調參。若它說「參數已漂出穩健區」,
# 那個「要不要調整」的決定是你的。

on:
  workflow_dispatch:
    inputs:
      open_issue:
        description: "跑完是否開 Issue 提醒你去讀"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

jobs:
  review:
    name: 產出年度健檢報告
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/requirements.txt

      - name: 安裝相依
        run: |
          python -m pip install --upgrade pip
          pip install -r ops/requirements.txt

      # 「資料源穩定度」那一節需要每日健檢累積的軌跡,而軌跡放在 ops-data 分支
      # (心跳刻意不推 main —— 見 daily-health.yml 的說明)
      - name: 取回健檢軌跡
        run: |
          mkdir -p ops/data
          # ⚠ 明確 refspec。`actions/checkout` 只設定目前分支的 fetch refspec
          #   (實測:remote.origin.fetch = +refs/heads/main:refs/remotes/origin/main),
          #   所以 `git fetch origin ops-data` 會 **exit 0** 卻不建立
          #   `origin/ops-data` —— 它只寫 FETCH_HEAD。接著 `git show
          #   origin/ops-data:…` 失敗,而 `>` 早就把目的檔建成 0 bytes 了。
          #   同一個陷阱在 daily-health.yml 的心跳步驟修過,這個檔漏掉。
          if git fetch origin +refs/heads/ops-data:refs/remotes/origin/ops-data 2>/dev/null; then
            # 先寫暫存檔再搬過去:`git show` 失敗時目的地不會留下一個 0 bytes
            # 的檔案。那種檔案 `exists()` 為真,而 pandas 讀它會拋
            # EmptyDataError —— 整份年度報告會因為一個輔助檔而產不出來。
            if git show origin/ops-data:ops/data/health_log.csv > "$RUNNER_TEMP/health_log.csv" 2>/dev/null; then
              mv "$RUNNER_TEMP/health_log.csv" ops/data/health_log.csv
              echo "已取回 $(wc -l < ops/data/health_log.csv) 行軌跡"
            else
              rm -f "$RUNNER_TEMP/health_log.csv"
              echo "ops-data 上還沒有 health_log.csv —— 資料源穩定度那一節會說明尚無紀錄"
            fi
          else
            echo "ops-data 分支尚不存在 —— 每日健檢還沒跑過"
          fi

      - name: 產出報告
        id: report
        working-directory: ops
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python src/annual_review.py
          echo "path=ops/reports/$(date -u +%Y)-health.md" >> "$GITHUB_OUTPUT"

      - name: 放進 workflow summary
        run: cat "${{ steps.report.outputs.path }}" >> "$GITHUB_STEP_SUMMARY"

      - name: 保存為 artifact
        uses: actions/upload-artifact@v4
        with:
          name: annual-health-report
          path: ${{ steps.report.outputs.path }}
          retention-days: 90

      # 報告推到 ops-data 分支,不推 main —— main 有分支保護且要求 CI 通過,
      # 而報告 commit 不該去跑一輪 CI。報告已同時存成 artifact 與 workflow summary。
      - name: Commit 報告到 ops-data 分支
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp=$(mktemp -d) && cp -r ops/reports "$tmp/"
          # `A && B || C` 的陷阱:B 失敗時 C 也會跑,而這裡的 C 是「從目前的
          # HEAD(也就是 main)開一條新的 ops-data」—— 接下來的 push 會變成
          # 非快轉而被拒。配上沒有明確 refspec 的 fetch(見上面那一步的說明),
          # B 是**必定**失敗的,所以這條路每次都會走到。寫成 if/else,
          # 讓「分支不存在」和「fetch 沒建立 ref」不要長得一樣。
          if git fetch origin +refs/heads/ops-data:refs/remotes/origin/ops-data 2>/dev/null; then
            git checkout -f -B ops-data origin/ops-data
          else
            echo "ops-data 尚不存在,由本次建立"
            git checkout -f -B ops-data
          fi
          mkdir -p ops && cp -r "$tmp/reports" ops/
          git add -f ops/reports/
          if git diff --cached --quiet; then
            echo "報告內容無變化,跳過 commit"
          else
            git commit -m "報告: 年度健檢 $(date -u +%Y)"
            git push origin ops-data
          fi

      - name: 開 Issue 提醒閱讀
        if: inputs.open_issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            # ⚠ 連結必須指向 ops-data,不是 main。報告只推 ops-data
            # (reports/ 在 ops/.gitignore 裡,main 上根本沒有這個檔案),
            # 原本寫成 main 的那個連結是死的 404。2026-10-14 修。
            echo "年度健檢報告已產出:[\`${{ steps.report.outputs.path }}\`](../blob/ops-data/${{ steps.report.outputs.path }})"
            echo
            echo "請花 15 分鐘讀完。重點看兩件事:"
            echo
            echo "1. **基準漂移** — 訊號層若有任何差異,那是 bug,不是市場變化。"
            echo "2. **參數敏感度** — 現行參數還在不在高原上。"
            echo
            echo "報告只陳述數字,不建議調參。要不要動是你的決定。"
            echo
            echo "<details><summary>完整報告</summary>"
            echo
            cat "${{ steps.report.outputs.path }}"
            echo
            echo "</details>"
          } > issue_body.md
          gh issue create \
            --title "年度健檢 $(date -u +%Y) · 待閱讀" \
            --body-file issue_body.md
