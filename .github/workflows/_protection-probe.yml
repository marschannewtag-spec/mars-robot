name: 臨時 · 分支保護實測

# 一次性驗證用,跑完就刪。
# 目的:確認 GITHUB_TOKEN(即 Claude autofix job 拿到的那個)真的推不動 main。
# 整個自動化設計都建立在這個假設上,不能只靠推論。
#
# 這個流程刻意【不會】因為推送被擋而失敗 —— 被擋才是我們要的結果。

on:
  workflow_dispatch:

permissions:
  contents: write # 故意給到最大,就是要看保護擋不擋得住

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 嘗試以 bot 身分直推 main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u > .protection-probe
          git add .protection-probe
          git commit -q -m "probe: 測試分支保護是否擋得住 bot"

          set +e
          out=$(git push origin HEAD:main 2>&1)
          rc=$?
          set -e

          echo "$out"
          echo
          if [ $rc -ne 0 ]; then
            echo "✅ **推送被擋下** —— 分支保護有效,bot 動不了 main。" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$out" | tail -5 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "🚨 **推送成功了 —— 分支保護沒有擋住 bot!**" >> "$GITHUB_STEP_SUMMARY"
            echo "整個自動化設計的前提不成立,必須立刻處理。正在還原這個 commit。" >> "$GITHUB_STEP_SUMMARY"
            git revert --no-edit HEAD
            git push origin HEAD:main || echo "還原失敗,需要人工處理"
          fi
